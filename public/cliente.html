<script>
  // URL de tu servidor en Render
  const RENDER_API_URL = window.location.origin; // Toma automáticamente el dominio actual (ej: https://...onrender.com)

  async function buscarVehiculo() {
    const inputEl = document.getElementById('input-placa');
    const errEl = document.getElementById('msg-error');
    const resCard = document.getElementById('resultado');

    const busquedaLimpia = inputEl.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

    errEl.style.display = 'none';
    resCard.style.display = 'none';

    if (!busquedaLimpia) {
      errEl.innerText = 'Por favor ingrese una patente válida.';
      errEl.style.display = 'block';
      return;
    }

    try {
      // Petición a tu API Node/Express en Render
      const res = await fetch(`${RENDER_API_URL}/api/ordenes`);
      
      if (!res.ok) {
        throw new Error('Error al conectar con el servidor');
      }

      const ordenes = await res.json();

      // Buscamos coincidencia de la patente ignorando guiones/espacios
      const ordenEncontrada = ordenes.find(o => {
        const placaDB = (o.placa || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        return placaDB === busquedaLimpia;
      });

      if (!ordenEncontrada) {
        errEl.innerText = `No se encontró ningún vehículo con la patente "${inputEl.value}".`;
        errEl.style.display = 'block';
        return;
      }

      const o = ordenEncontrada;

      // Mostrar Resultados
      document.getElementById('res-orden').innerText = '#' + o.id;
      document.getElementById('res-vehiculo').innerText = `${o.marca || ''} ${o.modelo || ''} (${o.placa})`;
      document.getElementById('res-cliente').innerText = o.cliente || o.nombre || 'Cliente';
      document.getElementById('res-diagnostico').innerText = o.diagnostico_inicial || o.diagnostico || 'Sin diagnóstico';
      document.getElementById('res-costo').innerText = `$ ${parseFloat(o.costo || 0).toLocaleString('es-AR')} ARS`;

      const estadoEl = document.getElementById('res-estado');
      let badgeClass = 'badge-reparacion';
      if (o.estado === 'Listo') badgeClass = 'badge-listo';
      if (o.estado === 'Entregado') badgeClass = 'badge-entregado';

      estadoEl.innerHTML = `<span class="badge ${badgeClass}">${o.estado || 'En Reparacion'}</span>`;
      resCard.style.display = 'block';

    } catch (err) {
      console.error(err);
      errEl.innerText = 'Error de conexión con el servidor de Render.';
      errEl.style.display = 'block';
    }
  }

  document.getElementById('input-placa').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      buscarVehiculo();
    }
  });
</script>
